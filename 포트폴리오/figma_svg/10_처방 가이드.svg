<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#EAE0CF"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" letter-spacing="2.20" text-anchor="start"><tspan x="140" y="124.3">10</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="200" y="124.3">처방 가이드</tspan></text><rect x="140" y="145" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.3"/><text font-family="Noto Serif KR" font-size="56" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="241.9">채움 크림 DRY와 2층 토너</tspan></text><text font-family="Noto Sans KR" font-size="26" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="306.7">처방 전 방향이다 — 실제 원료·비율은 ODM 처방 역량과 안정도 시험으로 정한다</tspan></text><text font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="1026.6">근거: 피부 지질 구성(세라마이드·콜레스테롤·지방산) 처방 사례 · 2층 오일 토너 시장 조사 · 처방은 가상 시나리오</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="389.9">항목</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="380" y="389.9">채움 크림 DRY</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="1080" y="389.9">채움 토너 DRY (2층)</tspan></text><rect x="140" y="409.1" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.5"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="442.0">제형 방향</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="380" y="445.3">수상 비율이 높은 크림 → 바를 때 수분감, 흡수 후 지질 성분이 얇게 남는 2단</tspan><tspan x="380" y="475.8">텍스처</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1080" y="445.3">아래 수분층 + 위 오일층(약 5%), 흔들면 섞였다 다시 나뉨</tspan></text><rect x="140" y="496.0" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="528.9">채움 성분</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="380" y="532.2">히알루론산, 글리세린, 판테놀</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1080" y="532.2">글리세린, 히알루론산 (수분층)</tspan></text><rect x="140" y="552.45" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="585.3">잠금 성분</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="380" y="588.7">세라마이드 조합(세라마이드엔피 등) + 콜레스테롤 + 지방산, 스쿠알란, 동백</tspan><tspan x="380" y="619.1">씨오일</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1080" y="588.7">동백 씨오일(Camellia Japonica Seed Oil) 중심 오일층</tspan></text><rect x="140" y="639.35" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="672.2">동백 씨오일</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="380" y="675.6">에몰리언트로 세라마이드·스쿠알란과 함께 마무리감</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1080" y="675.6">오일층의 주인공 — 전성분에서 오일 중 앞에 오도록</tspan></text><rect x="140" y="695.8000000000001" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="728.7">공통 원칙</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="380" y="732.0">향료 무첨가, 색소 최소화. &#x27;저자극&#x27; 문구는 첩포시험 근거가 있을 때만</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1080" y="732.0">같음 + 층 분리·펌프 막힘 안정성 시험</tspan></text><rect x="140" y="752.2500000000001" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/></svg>