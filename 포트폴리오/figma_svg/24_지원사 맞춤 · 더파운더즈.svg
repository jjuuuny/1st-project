<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#EAE0CF"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" letter-spacing="2.20" text-anchor="start"><tspan x="140" y="124.3">24</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="200" y="124.3">지원사 맞춤 · 더파운더즈</tspan></text><rect x="140" y="145" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.3"/><text font-family="Noto Serif KR" font-size="56" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="241.9">아누아에 적용한다면</tspan></text><text font-family="Noto Sans KR" font-size="26" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="306.7">&quot;브랜드 메시지-제형-고객 니즈를 연결하는 히어로 제품&quot; — 온결은 같은 구조로 기획했다</tspan></text><text font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="1026.6">근거: DART 더파운더즈 2025 연결감사보고서 · 아누아 미국 공식몰 · 사람인 채용 공고(2026-11) · 제안은 지원자 의견</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="389.9">2025 매출 (연결)</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="400" y="392.1">7,177억 원 (전년 4,278억, +68%)</tspan></text><rect x="140" y="410.0" width="780" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="440.9">영업이익</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="400" y="443.1">1,295억 원 (전년 1,457억, −11%)</tspan></text><rect x="140" y="461.0" width="780" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="491.9">광고선전비</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="400" y="494.1">1,180억 원 (전년 452억)</tspan></text><rect x="140" y="512.0" width="780" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="542.9">주력 제품</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="400" y="545.1">어성초 77 수딩 토너, PDRN 히알루론산 부스터 토너,</tspan><tspan x="400" y="574.1">배리어 리부트 크림</tspan></text><rect x="140" y="592.0" width="780" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="622.9">내세우는 성과</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="400" y="625.1">화해 어워드 수분 부문 1위, 올리브영 어워즈 5관왕, 미국</tspan><tspan x="400" y="654.1">아마존·틱톡샵 상위</tspan></text><rect x="140" y="672.0" width="780" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><rect x="960" y="370" width="820" height="340" rx="0" fill="#F3ECE2" fill-opacity="1"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" text-anchor="start"><tspan x="996" y="424.3">제안 2가지</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#521827" text-anchor="start"><tspan x="996" y="472.1">1. 배리어 리부트에 &#x27;시간 약속&#x27; 실증</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="996" y="500.9">&#x27;수분 1위&#x27;를 &#x27;지속&#x27;으로 넓힌다 — 마지막 도포 후 약 8시간 TEWL·수분량을 함께 측정·표기 (온결</tspan><tspan x="996" y="527.0">07·19장 시험 설계).</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#521827" text-anchor="start"><tspan x="996" y="573.3">2. 광고비 대비 히어로 재구매</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="996" y="602.1">광고비가 2.6배 늘며 영업이익이 줄었다 → SKU 확장보다 히어로 리필·대용량으로 재구매를 키운다</tspan><tspan x="996" y="628.2">(온결 1:1 리필 조사).</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="140" y="821.0">연결점: 히어로 1개 집중 · 소비자 조사로 USP 정리(타깃 연령 조정, 경쟁 전성분 비교) · 출시 일정</tspan><tspan x="140" y="848.5">역산(T-12개월)</tspan></text></svg>