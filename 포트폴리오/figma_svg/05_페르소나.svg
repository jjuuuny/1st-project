<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#EAE0CF"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" letter-spacing="2.20" text-anchor="start"><tspan x="140" y="124.3">05</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="200" y="124.3">페르소나</tspan></text><rect x="140" y="145" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.3"/><text font-family="Noto Serif KR" font-size="56" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="241.9">누구의 어떤 문제인가</tspan></text><text font-family="Noto Sans KR" font-size="26" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="306.7">연령별 비중은 조사 근거, 인물과 생활 장면은 가상 설정이다</tspan></text><text font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="1026.6">근거: 오픈서베이 뷰티 트렌드 리포트 2022</tspan></text><rect x="140" y="370" width="800" height="600" rx="0" fill="#F3ECE2" fill-opacity="1"/><rect x="140" y="370" width="800" height="8" rx="0" fill="#521827" fill-opacity="1"/><text font-family="Noto Sans KR" font-size="20" font-weight="500" fill="#7A5A5A" text-anchor="start"><tspan x="180" y="427.1">A. 주 타깃 — 건성</tspan></text><text font-family="Noto Serif KR" font-size="36" font-weight="700" fill="#521827" text-anchor="start"><tspan x="180" y="479.8">서윤, 37세 직장인</tspan></text><text font-family="Noto Sans KR" font-size="17" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="180" y="545.8">피부</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="340" y="548.2">세안 후 바로 당기고, 오후엔 볼에 각질</tspan></text><text font-family="Noto Sans KR" font-size="17" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="180" y="596.2">지금 루틴</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="340" y="598.7">토너 → 크림 2겹, 그래도 아침에 당김</tspan></text><text font-family="Noto Sans KR" font-size="17" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="180" y="646.7">구매 장면</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="340" y="649.1">가을 첫 찬바람에 크림을 다시 찾다가 리뷰로 비교</tspan></text><text font-family="Noto Sans KR" font-size="17" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="180" y="697.1">원하는 것</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="340" y="699.6">밤에 바르면 아침까지 안 당기는 크림</tspan></text><text font-family="Noto Sans KR" font-size="17" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="180" y="747.6">온결 제안</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#521827" text-anchor="start"><tspan x="340" y="750.0">가을 듀오 (2층 토너 + 채움 크림 DRY)</tspan></text><text font-family="Noto Sans KR" font-size="17" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="180" y="798.0">근거 수치</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="340" y="800.5">35~44세 건성 28.3%</tspan></text><rect x="980" y="370" width="800" height="600" rx="0" fill="#F3ECE2" fill-opacity="1"/><rect x="980" y="370" width="800" height="8" rx="0" fill="#C8553D" fill-opacity="1"/><text font-family="Noto Sans KR" font-size="20" font-weight="500" fill="#7A5A5A" text-anchor="start"><tspan x="1020" y="427.1">B. 보조 — 수분 부족형 지성</tspan></text><text font-family="Noto Serif KR" font-size="36" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1020" y="479.8">지호, 27세 직장인</tspan></text><text font-family="Noto Sans KR" font-size="17" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="1020" y="545.8">피부</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1180" y="548.2">T존은 번들거리는데 볼은 속당김</tspan></text><text font-family="Noto Sans KR" font-size="17" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="1020" y="596.2">지금 루틴</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1180" y="598.7">가벼운 젤만, 겨울엔 속건조</tspan></text><text font-family="Noto Sans KR" font-size="17" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="1020" y="646.7">구매 장면</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1180" y="649.1">네이버 쇼핑·화해에서 &quot;수부지 크림&quot; 검색</tspan></text><text font-family="Noto Sans KR" font-size="17" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="1020" y="697.1">원하는 것</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1180" y="699.6">번들거림 없이 속당김만 잡는 것</tspan></text><text font-family="Noto Sans KR" font-size="17" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="1020" y="747.6">온결 제안</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1180" y="750.0">가을엔 토너 소량 + 크림 얇게 → 봄엔 채움 젤크림 OILY</tspan></text><text font-family="Noto Sans KR" font-size="17" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="1020" y="798.0">근거 수치</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1180" y="800.5">25~34세 수분 부족 지성 27.8%</tspan></text></svg>