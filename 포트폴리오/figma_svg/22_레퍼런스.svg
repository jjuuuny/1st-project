<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#EAE0CF"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" letter-spacing="2.20" text-anchor="start"><tspan x="140" y="124.3">22</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="200" y="124.3">레퍼런스</tspan></text><rect x="140" y="145" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.3"/><text font-family="Noto Serif KR" font-size="56" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="241.9">달바에서 배운 것</tspan></text><text font-family="Noto Sans KR" font-size="26" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="306.7">기초 단일 히어로로 성장한 사례 — 히어로 1개 + 순차 확장, 기억되는 원료, 높은 초기 광고비</tspan></text><text font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="1026.6">근거: 달바글로벌 2025 사업보고서(DART) · 한화투자증권 리포트 · 블로터(2026-09)</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="389.9">달바 (2025 사업보고서)</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="960" y="389.9">이 기획에 적용한 점</tspan></text><rect x="140" y="408.1" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.5"/><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="443.3">매출 5,197억 원, 영업이익 1,015억 원</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="960" y="443.3">기초 단일 히어로로 성장한 사례</tspan></text><rect x="140" y="462.55" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="497.8">스프레이 세럼 하나로 시작 → 크림·선케어로 확장. 미스트 비중 54%(2024) → 42.4%(2026</tspan><tspan x="140" y="528.2">상반기)</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="960" y="497.8">히어로 1개 + 순차 확장 (가을 2종 → 봄 4종)</tspan></text><rect x="140" y="547.45" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="582.7">화이트 트러플이라는 기억되는 원료</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="960" y="582.7">대표 원료 동백</tspan></text><rect x="140" y="601.9000000000001" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="637.1">광고선전비 매출의 23.2%</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="960" y="637.1">1년차 광고비를 업종 평균보다 높게 가정</tspan></text><rect x="140" y="656.3500000000001" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="691.6">올리브영은 스프레이 세럼을 &#x27;미스트/오일&#x27;로 분류</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="960" y="691.6">명칭과 사용법이 카테고리를 정한다 → 2층 스프레이 토너는 &#x27;토너&#x27; 명칭과 세안 직후 첫 단계</tspan><tspan x="960" y="722.0">사용법을 고정</tspan></text><rect x="140" y="741.2500000000001" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/></svg>