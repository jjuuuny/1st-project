<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#EAE0CF"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" letter-spacing="2.20" text-anchor="start"><tspan x="140" y="124.3">14</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="200" y="124.3">런칭 마케팅</tspan></text><rect x="140" y="145" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.3"/><text font-family="Noto Serif KR" font-size="56" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="241.9">첫 리뷰 500건을 어떻게 모으나</tspan></text><text font-family="Noto Sans KR" font-size="26" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="306.7">리뷰 작성률 약 8%로 역산하면 1,000건은 주문 약 1만 2,500건이 필요 → 목표를 500건으로 낮추고 두 경로로 채운다</tspan></text><text font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="1026.6">근거: 리뷰 솔루션 업체 작성률 자료(뷰티 8.0%) · 체험단 대행 공개 단가 · 공정위 추천·보증 심사지침 개정 보도 · 비용은 견적 전 가정</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="419.9">경로</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="360" y="419.9">리뷰 목표</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="560" y="419.9">방법</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="1200" y="419.9">비용·조건 (가정)</tspan></text><rect x="140" y="439.1" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.5"/><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="476.4">체험단</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" text-anchor="start"><tspan x="360" y="476.4">300건</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="560" y="476.4">리뷰 앱(화해) 체험단 + 체험단 플랫폼. 건성 30대 여성 우선 선발</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1200" y="476.4">1건 약 1.4만~2.1만 원 → 약 420만~640만 원</tspan></text><rect x="140" y="497.0" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="534.3">구매 리뷰</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" text-anchor="start"><tspan x="360" y="534.3">200건</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="560" y="534.3">가을 듀오 구매자 미니 증정 + 사용 2주 후 리뷰 요청</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1200" y="534.3">작성률 8~10% 기준 주문 약 2,000~2,500건</tspan></text><rect x="140" y="554.9" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="592.2">합계</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" text-anchor="start"><tspan x="360" y="592.2">500건</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="560" y="592.2"></tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1200" y="592.2"></tspan></text><rect x="140" y="612.8" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="679.0">지키는 규칙</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="140" y="709.2">체험단·협찬 게시물은 제목이나 첫 부분에 &#x27;광고&#x27; 또는 &#x27;협찬&#x27;을 표시한다. 가이드에서 &quot;장벽 개선&quot;, &quot;수분 n% 증가&quot; 같은 효능 표현을 금지하고, 시간 약속은 시험 결과가 나온 뒤에만 쓴다.</tspan></text></svg>