<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#EAE0CF"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" letter-spacing="2.20" text-anchor="start"><tspan x="140" y="124.3">19</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="200" y="124.3">실행 계획</tspan></text><rect x="140" y="145" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.3"/><text font-family="Noto Serif KR" font-size="56" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="241.9">출시 T(가을) 기준 역산 일정</tspan></text><text font-family="Noto Sans KR" font-size="26" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="306.7">차별점이 실증이므로 시험 설계는 브랜드가 쥔다 — ODM 생산 + 시험기관 직접 계약 (가상 시나리오, 업체 미특정)</tspan></text><text font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="1026.6">근거: 식약처 피부장벽 기능성 가이드라인 · 기간은 견적 전 가정 (가상 시나리오)</tspan></text><rect x="140" y="380" width="1640" height="58" rx="0" fill="#F3ECE2" fill-opacity="1"/><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#521827" text-anchor="start"><tspan x="162" y="416.1">T-12개월</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#521827" text-anchor="start"><tspan x="300" y="416.0">콘셉트·히어로 확정, 제조사 선정, 처방 착수</tspan></text><rect x="240" y="458" width="1540" height="58" rx="0" fill="#F3ECE2" fill-opacity="1"/><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#521827" text-anchor="start"><tspan x="262" y="494.1">T-9개월</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#521827" text-anchor="start"><tspan x="400" y="494.0">처방 확정, 안정도 시험(2층 토너 층 분리·펌프 막힘 포함), 용기(튜브·스프레이 펌프) 선정</tspan></text><rect x="340" y="536" width="1440" height="58" rx="0" fill="#F3ECE2" fill-opacity="1"/><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#521827" text-anchor="start"><tspan x="362" y="572.1">T-6개월</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#521827" text-anchor="start"><tspan x="500" y="572.0">인체적용시험 시작 (각질층 수분량 + TEWL, 4주)</tspan></text><rect x="440" y="614" width="1340" height="58" rx="0" fill="#F3ECE2" fill-opacity="1"/><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#521827" text-anchor="start"><tspan x="462" y="650.1">T-3개월</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#521827" text-anchor="start"><tspan x="600" y="650.0">시험 결과 확보, 패키지·상세페이지 확정, 생산 발주</tspan></text><rect x="540" y="692" width="1240" height="58" rx="0" fill="#F3ECE2" fill-opacity="1"/><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#521827" text-anchor="start"><tspan x="562" y="728.1">T-1개월</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#521827" text-anchor="start"><tspan x="700" y="728.0">생산·입고, 자사몰·스마트스토어 등록</tspan></text><rect x="640" y="770" width="1140" height="58" rx="0" fill="#521827" fill-opacity="1"/><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#F3ECE2" text-anchor="start"><tspan x="662" y="806.1">T</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#F3ECE2" text-anchor="start"><tspan x="800" y="806.0">히어로 크림 + 건성 토너 출시</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="881.0">실증 범위</tspan></text><text font-family="Noto Sans KR" font-size="17" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="140" y="908.3">1년차는 히어로 크림만 시험하고, 다른 제품에 결과를 빌려 쓰지 않는다. 피부장벽 기능성 심사는 히어로가 자리 잡은 뒤 검토한다 (대상·규모부터 일반 보습 시험과 다르다).</tspan></text></svg>