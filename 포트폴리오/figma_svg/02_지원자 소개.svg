<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#EAE0CF"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" letter-spacing="2.20" text-anchor="start"><tspan x="140" y="124.3">02</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="200" y="124.3">지원자 소개</tspan></text><rect x="140" y="145" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.3"/><text font-family="Noto Serif KR" font-size="56" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="241.9">만들고, 생산하고, 팔아 본 사람</tspan></text><text font-family="Noto Sans KR" font-size="26" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="306.7">반려견 라이프스타일 브랜드에서 기획·디자인·생산을 맡아, 시즌 메인 제품으로 성수기 브랜드 월 매출 2억 원을 만들었다</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="399.9">경력</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="360" y="404.3">앤블랭크(andblank) — 반려견 의류·가방·산책용품·식기 라이프스타일 브랜드</tspan></text><rect x="140" y="426.9" width="1000" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="461.8">기간·직무</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="360" y="466.2">2020.12 입사 (2021.01 정규직) ~ 2025.11 / 제품 디자인·개발 팀장</tspan><tspan x="360" y="498.1">(기획·디자인·생산, 그래픽·MD·SCM 담당과 협업)</tspan></text><rect x="140" y="520.7" width="1000" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="555.6">역할</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="360" y="560.0">브랜드 제품 업무 95% 이상 참여 — 기획, 디자인, 생산(중국·베트남·국내 OEM 공장</tspan><tspan x="360" y="591.9">관리)</tspan></text><rect x="140" y="614.5" width="1000" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="649.4">성과</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" text-anchor="start"><tspan x="360" y="653.8">여름 시즌 &#x27;버그가드&#x27; 관련 제품을 메인으로 기획 — 성수기 브랜드 월 매출 2억 원</tspan><tspan x="360" y="685.7">달성 (버그가드 관련 제품이 판매 비중 최상위)</tspan></text><rect x="140" y="708.3" width="1000" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="743.2">해외</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="360" y="747.6">중국·베트남 OEM 생산, 앤블랭크 태국 공식 판매처 사입 물량 대응</tspan></text><rect x="140" y="770.1999999999999" width="1000" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1220" y="404.3">이 프로젝트와 이어지는 점</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="1220" y="436.0">중국·베트남·국내 OEM 공장과 직접 일정·품질을 맞춘 경험</tspan><tspan x="1220" y="465.0">→ 화장품 ODM 관리와 패키지 개발.</tspan><tspan x="1220" y="494.0">시즌 메인 제품에 집중한 경험 → &quot;가을 히어로 크림 하나로 겨울</tspan><tspan x="1220" y="523.0">성수기를 잡는&quot; 전략.</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1220" y="576.2">고객을 보는 방식</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="1220" y="607.9">리뷰(자사몰·외부 플랫폼), 전화 문의 응대, 펫페어 현장</tspan><tspan x="1220" y="636.9">판매(카운터 직접 운영) — 세 갈래로 고객 반응을 확인했다.</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1220" y="690.1">지원 동기</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="1220" y="721.8">더 큰 시장에서 상품기획을 맡아 회사와 함께 성장하고 싶다. 업계</tspan><tspan x="1220" y="750.8">경험이 없는 부분은 시장·성분·규제·채널을 직접 조사해 채웠다.</tspan></text></svg>