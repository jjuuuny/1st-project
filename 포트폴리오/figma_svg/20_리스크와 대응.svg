<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#EAE0CF"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" letter-spacing="2.20" text-anchor="start"><tspan x="140" y="124.3">20</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="200" y="124.3">리스크와 대응</tspan></text><rect x="140" y="145" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.3"/><text font-family="Noto Serif KR" font-size="56" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="241.9">약점을 알고 순서대로 대응한다</tspan></text><text font-family="Noto Sans KR" font-size="26" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="306.7">시험 결과가 기대에 못 미치면: 표현 수준 조정 → 처방 보완 후 재시험 → 출시 지연 순으로 판단</tspan></text><text font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="1026.6">근거: 자체 리스크 점검 (가상 시나리오)</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="389.9">리스크</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="780" y="389.9">대응</tspan></text><rect x="140" y="407.1" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.5"/><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="441.3">상표 (&#x27;온결&#x27; 거절 이력)</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="780" y="441.3">대체 후보 준비, 출시 전 변리사 검토</tspan></text><rect x="140" y="459.55" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="493.8">표현 규제 (&#x27;무너지지 않게&#x27;, &#x27;장벽&#x27;)</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="780" y="493.8">실증 화면에서만 사용, 출시 전 광고 자문</tspan></text><rect x="140" y="512.0" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="546.2">실판매가 경쟁 (올리브영 기획가)</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="780" y="546.2">정가 유지 + 미니·체험 키트로 첫 구매 장벽 완화</tspan></text><rect x="140" y="564.45" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="598.7">신규 브랜드 광고비</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="780" y="598.7">1년차 광고비를 업종 평균(19%)보다 높게 가정</tspan></text><rect x="140" y="616.9000000000001" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="651.1">지성 고객 6개월 공백</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="780" y="651.1">가을 듀오 사용법 안내, 봄 젤크림 우선 출시</tspan></text><rect x="140" y="669.3500000000001" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="703.6">초도 재고가 남음</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="780" y="703.6">봄 재판매·입점 기획 세트로 사용기한 안에 소진</tspan></text><rect x="140" y="721.8000000000002" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="756.0">듀오에서 크림 수치가 토너 효과처럼 보임</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="780" y="756.0">실증 수치는 크림 제품 구간에만, 제품명과 함께 표기</tspan></text><rect x="140" y="774.2500000000002" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/></svg>