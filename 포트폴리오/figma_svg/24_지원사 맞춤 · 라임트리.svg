<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#EAE0CF"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" letter-spacing="2.20" text-anchor="start"><tspan x="140" y="124.3">24</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="200" y="124.3">지원사 맞춤 · 라임트리</tspan></text><rect x="140" y="145" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.3"/><text font-family="Noto Serif KR" font-size="56" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="241.9">리꼼에 적용한다면</tspan></text><text font-family="Noto Sans KR" font-size="26" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="306.7">원료 라인이 많을수록 히어로 하나와 같은 기준의 채널 비교가 필요하다</tspan></text><text font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="1026.6">근거: 리꼼 공식몰(2026-11) · 언론 기사 제목(일본 로프트 입점, 백화점 팝업, K-뷰티 엑스포) · 사람인 채용 공고 · 제안은 지원자 의견</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="389.9">라인</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="400" y="392.1">르블랑, 살몬 DNA, 비타필, 아줄렌, 콜라겐 스네일, 라이스,</tspan><tspan x="400" y="421.1">선인장, 미백 말차·녹차</tspan></text><rect x="140" y="439.0" width="780" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="469.9">베스트 (공식몰)</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="400" y="472.1">살몬 디엔에이 앰플·비타필 앰플 42,000원, 살몬 비타</tspan><tspan x="400" y="501.1">워터에센스 37,000원, 선인장 딥 모이스트 로션 36,500원</tspan></text><rect x="140" y="519.0" width="780" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="549.9">채널 확장</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="400" y="552.1">일본 로프트 입점, 현대백화점 팝업, 홈쇼핑, 해외 엑스포</tspan><tspan x="400" y="581.1">(기사 제목 기준)</tspan></text><rect x="140" y="599.0" width="780" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><rect x="960" y="370" width="820" height="340" rx="0" fill="#F3ECE2" fill-opacity="1"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" text-anchor="start"><tspan x="996" y="424.3">제안 2가지</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#521827" text-anchor="start"><tspan x="996" y="472.1">1. 라인 정리 + 히어로 지정</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="996" y="500.9">해외에서 먼저 반응한 &#x27;살몬 비타 워터에센스&#x27;를 히어로로 두고 국내·일본에 같은 히어로를 걸어</tspan><tspan x="996" y="527.0">리뷰·인지도를 모은다 (온결 08장 히어로 1개 집중).</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#521827" text-anchor="start"><tspan x="996" y="573.3">2. 채널별 같은 기준 손익표</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="996" y="602.1">홈쇼핑·백화점 팝업·로프트·자사몰을 수수료·물류·판촉비 같은 항목으로 비교한다 (온결 11장 같은</tspan><tspan x="996" y="628.2">기준 채널표).</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="140" y="781.0">연결점: 라인업 6종 중 출시 순서 결정(2 → 4 SKU) · 채널 단계 설계(자체 채널 → 시험 채널 → 대형</tspan><tspan x="140" y="808.5">채널) · 런칭 후 지표 설계</tspan></text></svg>