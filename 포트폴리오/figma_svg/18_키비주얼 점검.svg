<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#EAE0CF"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" letter-spacing="2.20" text-anchor="start"><tspan x="140" y="124.3">18</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="200" y="124.3">키비주얼 점검</tspan></text><rect x="140" y="145" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.3"/><text font-family="Noto Serif KR" font-size="56" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="241.9">랭킹 상위 제품 옆에 놓아 보면</tspan></text><text font-family="Noto Sans KR" font-size="26" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="306.7">올리브영 온라인 크림 상위 10개에 와인색 용기가 없다 — 화해 크림·토너 상위 24개씩에도 와인·오렌지 본체는 없었다</tspan></text><text font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="1026.6">근거: 올리브영 온라인 랭킹 썸네일(2026-11-17) · 화해 글로벌 랭킹 크림·토너 상위 24(2026-11-19) · 색은 썸네일 기준 근사, 랭킹은 실시간으로 바뀐다</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="392.1">크림 랭킹 상위 10개 (본체 색)</tspan></text><rect x="140" y="410" width="96" height="140" rx="8" fill="#8EC9E8" fill-opacity="1" stroke="#CDBFA8" stroke-width="1"/><text font-family="Noto Sans KR" font-size="16" font-weight="400" fill="#7A5A5A" text-anchor="middle"><tspan x="188" y="577.7">1</tspan></text><rect x="252" y="410" width="96" height="140" rx="8" fill="#8EC9E8" fill-opacity="1" stroke="#CDBFA8" stroke-width="1"/><text font-family="Noto Sans KR" font-size="16" font-weight="400" fill="#7A5A5A" text-anchor="middle"><tspan x="300" y="577.7">2</tspan></text><rect x="364" y="410" width="96" height="140" rx="8" fill="#CDB58A" fill-opacity="1" stroke="#CDBFA8" stroke-width="1"/><text font-family="Noto Sans KR" font-size="16" 