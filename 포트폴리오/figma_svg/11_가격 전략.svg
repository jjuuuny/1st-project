<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#EAE0CF"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" letter-spacing="2.20" text-anchor="start"><tspan x="140" y="124.3">11</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="200" y="124.3">가격 전략</tspan></text><rect x="140" y="145" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.3"/><text font-family="Noto Serif KR" font-size="56" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="241.9">정가는 시장 중앙값, 근거는 실증</tspan></text><text font-family="Noto Sans KR" font-size="26" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="306.7">100ml 32,000원 = ml당 320원 = 장벽 크림 9개의 ml당 중앙값. 가격은 차별점이 아니라 진입 조건이다</tspan></text><text font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="1026.6">근거: 공정위 실태조사 인용 보도(2026-01) · 업종 평균 광고비율 리포트 · 원가 20%·수수료·물류 11.5%(달바 2025 운반비율 참고)는 견적 전 가정</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="403.2">실판매가는 약 22% 프리미엄</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="140" y="433.4">올리브영 기획가로 보면 아토베리어365는 ml당 약 262원. 우리 정가가 약 22% 비싸다 → &quot;정가는</tspan><tspan x="140" y="461.0">중앙값, 근거는 실증&quot;으로 정직하게 포지셔닝한다.</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="512.8">원가 20% 가정</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="140" y="543.0">올리브영 직매입 공급가(소비자가 60%) 기준 원가율 약 33% → 업종 평균 매출원가율 40%보다 낮은</tspan><tspan x="140" y="570.5">목표.</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="622.3">올리브영은 노출을 사는 채널</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="140" y="652.5">같은 기준으로 올리브영 온라인 13.5%, 매장(부대비용 포함) −11.9%. 수익은 자체 채널이 맡는다.</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="700" fill="#7A5A5A" text-anchor="start"><tspan x="1000" y="399.9">채널별 남는 금액 — 같은 기준</tspan><tspan x="1000" y="426.0">(원가·수수료·광고비 19%·물류 11.5% 차감, 올리브영은 25% 할인가)</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1000" y="491.0">자사몰 (수수료 3%)</tspan></text><rect x="1000" y="504" width="651.0" height="34" rx="0" fill="#521827" fill-opacity="1"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1663.0" y="528.3">46.5%</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1000" y="587.0">스마트스토어 (7%)</tspan></text><rect x="1000" y="600" width="595.0" height="34" rx="0" fill="#521827" fill-opacity="1"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1607.0" y="624.3">42.5%</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1000" y="683.0">올리브영 온라인 (29.36%)</tspan></text><rect x="1000" y="696" width="189.0" height="34" rx="0" fill="#521827" fill-opacity="0.5"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1201.0" y="720.3">13.5%</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1000" y="779.0">올리브영 매장 (40%)</tspan></text><rect x="1000" y="792" width="39.199999999999996" height="34" rx="0" fill="#521827" fill-opacity="0.5"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1051.2" y="816.3">2.8%</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1000" y="875.0">올리브영 매장 + 부대비용 (54.74%)</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#C8553D" text-anchor="start"><tspan x="1000" y="912.3">−11.9% (손실)</tspan></text></svg>