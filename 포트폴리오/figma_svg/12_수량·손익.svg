<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#EAE0CF"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" letter-spacing="2.20" text-anchor="start"><tspan x="140" y="124.3">12</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="200" y="124.3">수량·손익</tspan></text><rect x="140" y="145" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.3"/><text font-family="Noto Serif KR" font-size="56" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="241.9">얼마나 만들고, 몇 개 팔아야 하나</tspan></text><text font-family="Noto Sans KR" font-size="26" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="306.7">초도는 첫 겨울 주문 역산 + 체험단 + 안전재고, 손익분기는 같은 기준의 개당 남는 금액으로 계산한다</tspan></text><text font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="1026.6">근거: 화장품 ODM MOQ 보도(2023~) · 리뷰 작성률 역산 · 수치는 견적 전 가정 (가상 시나리오)</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="389.9">항목</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="440" y="389.9">값 (가정)</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="1000" y="389.9">근거</tspan></text><rect x="140" y="409.1" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.5"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="442.0">초도 생산</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#521827" text-anchor="start"><tspan x="440" y="445.3">크림 3,000개 · 2층 토너 3,000개</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1000" y="445.3">듀오 주문 2,000~2,500건(리뷰 역산) + 체험단 300 + 안전재고. 대형 ODM이 인디</tspan><tspan x="1000" y="475.8">MOQ를 1,000개 단위로 낮췄다는 보도</tspan></text><rect x="140" y="496.0" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="528.9">미니</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#521827" text-anchor="start"><tspan x="440" y="532.2">토너 30ml · 크림 10ml 각 3,000개</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1000" y="532.2">듀오 구매자·체험단 증정</tspan></text><rect x="140" y="552.45" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="585.3">개당 남는 금액</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#521827" text-anchor="start"><tspan x="440" y="588.7">자사몰 14,880원 / 스마트스토어 13,600원</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1000" y="588.7">11장 같은 기준</tspan></text><rect x="140" y="608.9000000000001" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="641.8">손익분기 판매량</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#521827" text-anchor="start"><tspan x="440" y="645.1">고정비 2,000만 원 가정 ÷ 14,880원 ≈ 1,350개</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1000" y="645.1">고정비 = 인체적용시험 + 체험단 420만~640만 원 + 디자인·촬영 (견적 전)</tspan></text><rect x="140" y="665.3500000000001" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="698.2">첫 겨울 매출 목표</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#521827" text-anchor="start"><tspan x="440" y="701.6">약 1.1억~1.4억 원</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1000" y="701.6">듀오 2,000~2,500건 × 55,000원 (정가 기준)</tspan></text><rect x="140" y="721.8000000000002" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="140" y="780.9">재고가 남으면 사용기한 안에 봄 재판매·올리브영 입점 기획 세트로 소진한다. 실제 값은 ODM 2~3곳 MOQ·단가와 시험기관 견적으로 확정한다.</tspan></text></svg>