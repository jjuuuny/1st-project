<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#EAE0CF"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" letter-spacing="2.20" text-anchor="start"><tspan x="140" y="124.3">07</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="200" y="124.3">콘셉트</tspan></text><rect x="140" y="145" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.3"/><text font-family="Noto Serif KR" font-size="56" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="241.9">채우고, 잠그는 장벽</tspan></text><text font-family="Noto Sans KR" font-size="26" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="306.7">콘셉트 문장이 곧 시험 항목이다 — 채움은 각질층 수분량, 잠금은 수분 손실로 증명한다</tspan></text><text font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="1026.6">근거: 화장품법 시행규칙 제2조 · 식약처 화장품 표시·광고 관리 지침 별표 2 · 시험 계획은 가상 시나리오</tspan></text><text font-family="Noto Serif KR" font-size="44" font-weight="700" fill="#521827" text-anchor="start"><tspan x="500" y="418.6">채움</tspan></text><text font-family="Noto Serif KR" font-size="44" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1140" y="418.6">잠금</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="469.9">뜻</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="500" y="474.3">각질층에 수분을 채운다</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1140" y="474.3">채운 수분이 빠져나가지 않게 한다</tspan></text><rect x="140" y="496.9" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="531.8">측정 지표</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" text-anchor="start"><tspan x="500" y="536.2">각질층 수분량</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1140" y="536.2">경피수분손실 (TEWL)</tspan></text><rect x="140" y="558.8" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="593.7">맡는 성분</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="500" y="598.1">히알루론산, 글리세린, 판테놀</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1140" y="598.1">세라마이드 조합, 스쿠알란 + 동백 씨오일</tspan></text><rect x="140" y="620.6999999999999" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="655.6">슬로건</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="500" y="660.0">마르지 않게</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1140" y="660.0">무너지지 않게</tspan></text><rect x="140" y="682.5999999999999" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="717.5">고객이 느끼는 것</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="500" y="721.9">바를 때 촉촉한 수분감</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1140" y="721.9">얇은 막으로 바뀌어 아침까지 안 당김</tspan></text><rect x="140" y="744.4999999999999" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="140" y="801.6">&#x27;잠금&#x27;은 시간으로 증명한다: 사용 전·2주·4주와 마지막 도포 후 약 8시간(수면 시간) 시점에 측정하고, 아침 당김을 설문으로 묻는다. 두 지표 모두 채움 크림 DRY 한 제품으로 시험한다.</tspan></text></svg>