<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#EAE0CF"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" letter-spacing="2.20" text-anchor="start"><tspan x="140" y="124.3">21</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="200" y="124.3">성과 지표</tspan></text><rect x="140" y="145" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.3"/><text font-family="Noto Serif KR" font-size="56" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="241.9">첫 겨울, 무엇으로 판단하나</tspan></text><text font-family="Noto Sans KR" font-size="26" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="306.7">판매 지표(구매 리뷰·주간 판매량)와 노출 지표(체험단 콘텐츠)를 나눠 본다</tspan></text><text font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="1026.6">목표는 가정 (가상 시나리오)</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="389.9">시점</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="340" y="389.9">지표</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="900" y="389.9">목표 (가정)</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="1260" y="389.9">왜</tspan></text><rect x="140" y="405.1" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.5"/><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="436.2">첫 겨울 끝</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="340" y="436.2">구매 리뷰 수 (자사몰·스마트스토어)</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#521827" text-anchor="start"><tspan x="900" y="436.2">200건</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1260" y="436.2">실제 구매자 반응. 전체 리뷰 목표는 역산으로 500건</tspan></text><rect x="140" y="452.1" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="483.2">첫 겨울 끝</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="340" y="483.2">체험단 콘텐츠 수</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="900" y="483.2">300건</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1260" y="483.2">초기 노출·검색 콘텐츠 (판매 지표와 분리)</tspan></text><rect x="140" y="499.1" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="530.2">첫 겨울 끝</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="340" y="530.2">주간 판매량 (자체 채널)</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="900" y="530.2">기준선 확보</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1260" y="530.2">올리브영 MD에게 보여줄 판매 속도</tspan></text><rect x="140" y="546.1" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="577.2">첫 겨울 끝</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="340" y="577.2">아침 당김 만족도 (구매자 설문)</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="900" y="577.2">측정</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1260" y="577.2">고객 약속이 실제로 느껴지는지</tspan></text><rect x="140" y="593.1" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="624.2">첫 겨울 끝</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="340" y="624.2">히어로 재구매율 · 컬리 공헌이익</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="900" y="624.2">기준선 · 자사몰 대비</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1260" y="624.2">크림은 재구매가 핵심 / 외부 채널 확장 판단</tspan></text><rect x="140" y="640.1" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="671.2">이듬해 봄</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="340" y="671.2">지성 젤크림 첫 달 판매량, 듀오 구매자의 지성 제품 추가 구매</tspan><tspan x="340" y="700.2">비율</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="900" y="671.2">측정</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1260" y="671.2">6개월 공백 대응 효과</tspan></text><rect x="140" y="716.1" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="747.2">2년차</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="340" y="747.2">서브 히어로 판정</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="900" y="747.2">지성 제품별 리뷰·재구매</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="1260" y="747.2">1년차는 히어로 하나에 집중</tspan></text><rect x="140" y="763.1" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.18"/></svg>