<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#EAE0CF"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" letter-spacing="2.20" text-anchor="start"><tspan x="140" y="124.3">06</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="200" y="124.3">경쟁 분석</tspan></text><rect x="140" y="145" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.3"/><text font-family="Noto Serif KR" font-size="56" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="241.9">시장의 빈자리</tspan></text><text font-family="Noto Sans KR" font-size="26" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="306.7">세라마이드도, 실증도 이미 차별점이 아니다 → 고객이 고르는 이유는 시간 약속과 보이는 제형</tspan></text><text font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="1026.6">근거: 경쟁 장벽 크림 9개 판매처 표시가·리뷰 랭킹 (2026-11) · LG생활건강 보도자료(2024-08)</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="402.1">장벽 크림 9개 비교 (정가 기준)</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="459.9">중심 가격</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="370" y="464.3">3만 원 초반</tspan></text><rect x="140" y="484.9" width="720" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="517.8">중심 용량</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="370" y="522.2">80~100ml</tspan></text><rect x="140" y="542.8" width="720" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="575.7">ml당 가격 중앙값</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="370" y="580.1">320원</tspan></text><rect x="140" y="600.6999999999999" width="720" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="633.6">용기</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="370" y="638.0">확인한 7개 전부 튜브</tspan></text><rect x="140" y="658.5999999999999" width="720" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="691.5">공통 성분</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="370" y="695.9">세라마이드 (9개 중 7개)</tspan></text><rect x="140" y="716.4999999999999" width="720" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="749.4">디자인</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#521827" text-anchor="start"><tspan x="370" y="753.8">흰색 + 파란 계열, 대부분 영문 우선</tspan></text><rect x="140" y="774.3999999999999" width="720" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" text-anchor="start"><tspan x="960" y="404.3">1. 세라마이드는 차별점이 아니다</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="960" y="436.0">9개 중 7개가 쓰고, 세라마이드 + 히알루론산 조합도 이미 있다.</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" text-anchor="start"><tspan x="960" y="489.2">2. 실증은 이미 경쟁의 무기다</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="960" y="520.9">피지오겔 DMT는 보습·장벽 수치를 시험 조건과 함께 공개한다. 실증은 차별이 아니라 약속을</tspan><tspan x="960" y="549.9">증명하는 방식이다.</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" text-anchor="start"><tspan x="960" y="603.1">3. 표현이 겹친다</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="960" y="634.8">&#x27;속건조·장벽케어&#x27;는 피지오겔이 쓴다 → 우리는 &#x27;밤부터 아침까지&#x27;라는 시간으로 말한다.</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" text-anchor="start"><tspan x="960" y="688.0">4. 실제 판매가는 정가보다 낮다</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="960" y="719.7">아토베리어365 올리브영 기획 41,900원 (80ml 2개 + 앰플, 1개 환산 약 20,950원).</tspan></text></svg>