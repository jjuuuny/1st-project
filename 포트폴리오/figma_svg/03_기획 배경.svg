<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#EAE0CF"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" letter-spacing="2.20" text-anchor="start"><tspan x="140" y="124.3">03</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="200" y="124.3">기획 배경</tspan></text><rect x="140" y="145" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.3"/><text font-family="Noto Serif KR" font-size="56" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="241.9">왜 지금, 왜 장벽인가</tspan></text><text font-family="Noto Sans KR" font-size="26" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="306.7">이미 1위가 있는 장벽 크림 시장에서, 신규 브랜드는 무엇으로 선택받을 수 있는가?</tspan></text><text font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="1026.6">근거: 한국신용평가 산업 보고서 · 화해 트렌드 리포트 보도(2026) · 화해 글로벌 랭킹(2026-11) · Forbes(2026) · 네이버 데이터랩(2025-11~2026-11)</tspan></text><rect x="140" y="380" width="390" height="300" rx="0" fill="#F3ECE2" fill-opacity="1"/><text font-family="Noto Serif KR" font-size="52" font-weight="700" fill="#521827" text-anchor="start"><tspan x="176" y="472.5">8.6조 원</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="176" y="552.1">국내 스킨케어 시장</tspan><tspan x="176" y="581.1">(화장품 18.1조 원 중,</tspan><tspan x="176" y="610.1">2024, 선케어 포함)</tspan></text><rect x="560" y="380" width="390" height="300" rx="0" fill="#F3ECE2" fill-opacity="1"/><text font-family="Noto Serif KR" font-size="52" font-weight="700" fill="#521827" text-anchor="start"><tspan x="596" y="472.5">&#x27;방어막&#x27;</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="596" y="552.1">2026 스킨케어 핵심 키워드</tspan><tspan x="596" y="581.1">(화해 트렌드 리포트 보도)</tspan></text><rect x="980" y="380" width="390" height="300" rx="0" fill="#F3ECE2" fill-opacity="1"/><text font-family="Noto Serif KR" font-size="52" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1016" y="472.5">1위</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="1016" y="552.1">에스트라 아토베리어365</tspan><tspan x="1016" y="581.1">화해 글로벌 랭킹</tspan><tspan x="1016" y="610.1">2025 올리브영 어워즈</tspan></text><rect x="1400" y="380" width="390" height="300" rx="0" fill="#F3ECE2" fill-opacity="1"/><text font-family="Noto Serif KR" font-size="52" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1436" y="472.5">겨울 ↑</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="1436" y="552.1">&#x27;장벽 크림&#x27; 검색량</tspan><tspan x="1436" y="581.1">겨울에 높고 여름에 낮다</tspan><tspan x="1436" y="610.1">(네이버 데이터랩)</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="764.3">답</tspan></text><text font-family="Noto Serif KR" font-size="30" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="814.6">성분이 아니라 고객이 느끼는 시간으로 약속한다 — &quot;밤에 바르면 아침까지 안 당긴다&quot;.</tspan><tspan x="140" y="861.1">그 약속을 바를 때 보이는 제형과 공개된 시험 조건으로 증명한다.</tspan></text></svg>