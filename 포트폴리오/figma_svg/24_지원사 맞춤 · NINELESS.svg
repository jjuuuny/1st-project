<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#EAE0CF"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" letter-spacing="2.20" text-anchor="start"><tspan x="140" y="124.3">24</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="200" y="124.3">지원사 맞춤 · NINELESS</tspan></text><rect x="140" y="145" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.3"/><text font-family="Noto Serif KR" font-size="56" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="241.9">NINELESS에 적용한다면</tspan></text><text font-family="Noto Sans KR" font-size="26" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="306.7">판매·재고로 재생산을 정하고, 액티브 다음 단계를 기획한다</tspan></text><text font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="1026.6">근거: 사람인 채용 공고(회사 자체 기재 매출, 2026-11) · NINELESS 공식몰 제품 목록(2026-11) · 제안은 지원자 의견</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="389.9">매출 (회사 기재)</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="400" y="392.1">2024년 20억 → 2025년 55억, 2026 목표 100억+</tspan></text><rect x="140" y="410.0" width="780" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="440.9">채널</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="400" y="443.1">국내 유통 없이 해외 판매</tspan></text><rect x="140" y="461.0" width="780" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="491.9">제품 구성</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="400" y="494.1">공식몰 21개 중 대부분 고함량 액티브 세럼</tspan><tspan x="400" y="523.1">(아젤라익·AHA·BHA·TXA·나이아신아마이드)</tspan></text><rect x="140" y="541.0" width="780" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="571.9">보습 라인</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="400" y="574.1">HYDRA-MAX 세럼 1개, 크림은 아젤라익 크림 1개</tspan></text><rect x="140" y="592.0" width="780" height="1" rx="0" fill="#521827" fill-opacity="0.18"/><rect x="960" y="370" width="820" height="340" rx="0" fill="#F3ECE2" fill-opacity="1"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" text-anchor="start"><tspan x="996" y="424.3">제안 2가지</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#521827" text-anchor="start"><tspan x="996" y="472.1">1. 액티브 다음 단계 = 장벽 크림 1개</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="996" y="500.9">고함량 액티브를 쓰는 고객에게 &#x27;채우고, 잠그는&#x27; 장벽 크림을 루틴으로 붙여 객단가·재구매를 함께</tspan><tspan x="996" y="527.0">올린다 (온결 08·10장).</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#521827" text-anchor="start"><tspan x="996" y="573.3">2. 재생산 판단 기준표</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="996" y="602.1">SKU별 주간 판매 속도 × 리드타임 + 안전재고로 재생산 시점·수량을 정한다 (온결 12장</tspan><tspan x="996" y="628.2">초도·손익분기 계산 방식).</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="140" y="761.0">연결점: 반려동물 브랜드 생산관리 5년(공장 일정·발주·재고) · 용기·단상자·부자재 결정 경험 ·</tspan><tspan x="140" y="788.5">신제품 제형 결정(2층 토너 오일 5%)</tspan></text></svg>