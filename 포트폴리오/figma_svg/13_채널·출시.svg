<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#EAE0CF"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" letter-spacing="2.20" text-anchor="start"><tspan x="140" y="124.3">13</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="200" y="124.3">채널·출시</tspan></text><rect x="140" y="145" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.3"/><text font-family="Noto Serif KR" font-size="56" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="241.9">가을 듀오 → 이듬해 겨울 올리브영</tspan></text><text font-family="Noto Sans KR" font-size="26" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="306.7">첫 겨울은 수익이 높은 자체 채널에서 팔고, 리뷰·재구매 지표를 쌓아 올리브영에 들어간다</tspan></text><text font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="1026.6">근거: 브랜드별 토너 출시 순서 사례 · 입점 절차 조사 (플랫폼 공개 자료)</tspan></text><rect x="140" y="402" width="1640" height="2" rx="0" fill="#521827" fill-opacity="0.4"/><rect x="140" y="394" width="18" height="18" rx="0" fill="#521827" fill-opacity="1"/><text font-family="Noto Serif KR" font-size="28" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="460.9">가을</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="504.1">히어로 크림 + 건성 토너 듀오</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="140" y="569.0">자사몰 · 스마트스토어</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="601.4">리뷰·판매 데이터 확보</tspan></text><rect x="550" y="394" width="18" height="18" rx="0" fill="#521827" fill-opacity="1"/><text font-family="Noto Serif KR" font-size="28" font-weight="700" fill="#521827" text-anchor="start"><tspan x="550" y="460.9">첫 겨울</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#521827" text-anchor="start"><tspan x="550" y="504.1">같음</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="550" y="569.0">+ 컬리 1곳 시험</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="550" y="601.4">외부 채널 지표 확보</tspan></text><rect x="960" y="394" width="18" height="18" rx="0" fill="#521827" fill-opacity="1"/><text font-family="Noto Serif KR" font-size="28" font-weight="700" fill="#521827" text-anchor="start"><tspan x="960" y="460.9">이듬해 봄</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#521827" text-anchor="start"><tspan x="960" y="504.1">지성 젤크림 먼저 →</tspan><tspan x="960" y="533.1">지성 토너·세럼, 건성 세럼</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="960" y="569.0">같음</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="960" y="601.4">젤 제형과 계절이 맞음</tspan></text><rect x="1370" y="394" width="18" height="18" rx="0" fill="#521827" fill-opacity="1"/><text font-family="Noto Serif KR" font-size="28" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1370" y="460.9">이듬해 겨울</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1370" y="504.1">라인 전체</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="1370" y="569.0">+ 올리브영</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="1370" y="601.4">장벽 크림 성수기 입점</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="742.1">가을 듀오</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="140" y="770.9">정가 합계 55,000원 + 미니 증정. 할인 대신 구성으로 차별해 채널 간 정가를 같게 유지한다.</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="817.2">왜 올리브영을 1년 뒤에</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="140" y="846.0">입점은 상담 → 품평 → 계약 → 입고 순서라 가을 출시 직후 진행하면 첫 겨울 성수기를 놓친다.</tspan></text><text font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="892.3">지성 고객 6개월 공백</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="140" y="921.1">듀오 카드에 수부지 팁 — &quot;번들거림이 신경 쓰이는 날엔 조금 더 멀리서 가볍게, 당김이 남는 곳엔 한 번 더.&quot; 봄엔 젤크림 먼저.</tspan></text></svg>