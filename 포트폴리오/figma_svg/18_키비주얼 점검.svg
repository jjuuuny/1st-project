889.9">블루 계열 4 · 흰색·투명 3 · 핑크 2 · 골드 1 (흰 튜브의 파란 글씨까지 넣으면 블루 6)</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1440" y="401.0">겹치지 않는 곳</tspan></text><text font-family="Noto Sans KR" font-size="17" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="1440" y="428.3">라운드랩 동백(빨강·연핑크)과는 어두운</tspan><tspan x="1440" y="453.0">와인으로 구분한다.</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1440" y="501.8">겹칠 수 있는 곳</tspan></text><text font-family="Noto Sans KR" font-size="17" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="1440" y="529.2">감 오렌지는 앰버 토너(2개)와 가까워 면적을</tspan><tspan x="1440" y="553.8">절반 이하로 둔다. 반투명 병 위 오일층은 달바</tspan><tspan x="1440" y="578.5">스프레이 세럼을 떠올리게 할 수 있어</tspan><tspan x="1440" y="603.1">골드·금속을 쓰지 않고 &#x27;토너&#x27; 명칭으로</tspan><tspan x="1440" y="627.8">구분한다.</tspan></text></svg>