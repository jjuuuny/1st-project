<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#EAE0CF"/><text font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#521827" letter-spacing="2.20" text-anchor="start"><tspan x="140" y="124.3">04</tspan></text><text font-family="Noto Sans KR" font-size="22" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="200" y="124.3">타깃</tspan></text><rect x="140" y="145" width="1640" height="1" rx="0" fill="#521827" fill-opacity="0.3"/><text font-family="Noto Serif KR" font-size="56" font-weight="700" fill="#521827" text-anchor="start"><tspan x="140" y="241.9">건성 + 수분 부족형 지성 = 약 50%</tspan></text><text font-family="Noto Sans KR" font-size="26" font-weight="400" fill="#521827" text-anchor="start"><tspan x="140" y="306.7">공통 고민은 &quot;수분이 머물지 않는다&quot; — 주 타깃은 건성이 늘기 시작하는 30대 중심(25~44세) 여성</tspan></text><text font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="140" y="1026.6">근거: 오픈서베이 뷰티 트렌드 리포트 2022 (한국 20~49세 여성 1,500명, 2022.1.3~1.5) · 한국경제(2026-07)</tspan></text><rect x="170" y="738.3" width="70" height="161.7" rx="0" fill="#521827" fill-opacity="0.45"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#521827" text-anchor="middle"><tspan x="205" y="724.2">14.7</tspan></text><rect x="250" y="519.4" width="70" height="380.6" rx="0" fill="#C8553D" fill-opacity="0.45"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#521827" text-anchor="middle"><tspan x="285" y="505.3">34.6</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="middle"><tspan x="245" y="933.9">20-24세</tspan></text><rect x="400" y="622.8" width="70" height="277.2" rx="0" fill="#521827" fill-opacity="1"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#521827" text-anchor="middle"><tspan x="435" y="608.7">25.2</tspan></text><rect x="480" y="594.2" width="70" height="305.8" rx="0" fill="#C8553D" fill-opacity="1"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#521827" text-anchor="middle"><tspan x="515" y="580.1">27.8</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="middle"><tspan x="475" y="933.9">25-34세</tspan></text><rect x="630" y="588.7" width="70" height="311.3" rx="0" fill="#521827" fill-opacity="1"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#521827" text-anchor="middle"><tspan x="665" y="574.6">28.3</tspan></text><rect x="710" y="694.3" width="70" height="205.7" rx="0" fill="#C8553D" fill-opacity="1"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#521827" text-anchor="middle"><tspan x="745" y="680.2">18.7</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="middle"><tspan x="705" y="933.9">35-44세</tspan></text><rect x="860" y="472.1" width="70" height="427.9" rx="0" fill="#521827" fill-opacity="0.45"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#521827" text-anchor="middle"><tspan x="895" y="458.0">38.9</tspan></text><rect x="940" y="757.0" width="70" height="143.0" rx="0" fill="#C8553D" fill-opacity="0.45"/><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#521827" text-anchor="middle"><tspan x="975" y="742.9">13.0</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="middle"><tspan x="935" y="933.9">45-49세</tspan></text><rect x="150" y="900" width="930" height="2" rx="0" fill="#521827" fill-opacity="0.5"/><rect x="170" y="384" width="22" height="22" rx="0" fill="#521827" fill-opacity="1"/><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="202" y="398.1">건성</tspan></text><rect x="290" y="384" width="22" height="22" rx="0" fill="#C8553D" fill-opacity="1"/><text font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#521827" text-anchor="start"><tspan x="322" y="398.1">수분 부족형 지성</tspan></text><text font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#7A5A5A" text-anchor="start"><tspan x="560" y="397.9">진한 막대 = 주 타깃 25~44세</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1200" y="403.2">비중 (한국 20~49세 여성)</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="1200" y="433.4">건성 27.5% (2위) · 수분 부족형 지성 22.7% (3위)</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1200" y="485.2">타입과 상태를 나눠 봤다</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="1200" y="515.4">수분 부족은 타고난 타입이 아니라 &#x27;상태&#x27;라서 건성과 지성을 하나의</tspan><tspan x="1200" y="543.0">콘셉트로 묶을 수 있다.</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1200" y="594.8">30대 중심인 이유</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="1200" y="625.0">35~44세부터 건성이 뚜렷이 많아져 히어로(건성 크림)와 맞는다. 20대</tspan><tspan x="1200" y="652.5">초반은 봄 지성 라인으로 넓힌다.</tspan></text><text font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#521827" text-anchor="start"><tspan x="1200" y="704.3">성별 공용 · 복합성</tspan></text><text font-family="Noto Sans KR" font-size="19" font-weight="400" fill="#5A3A3A" text-anchor="start"><tspan x="1200" y="734.5">남성은 공용 패키지·무향 처방으로 흡수. 복합성(35.6%)은 &#x27;수분 부족&#x27;</tspan><tspan x="1200" y="762.1">기준으로 두 라인 중 하나로 안내한다.</tspan></text></svg>